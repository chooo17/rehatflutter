<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Rehat Coffeehouse — pesan kopi favoritmu, kumpulkan stamp & voucher. Langsung dari browser, tanpa perlu install.">
  <meta name="theme-color" content="#B47832">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Rehat Coffeehouse">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Rehat Coffeehouse</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body { margin: 0; background-color: #FAF7F2; }
    /* Layar muat awal (sebelum Flutter selesai boot) agar tak ada kilatan putih. */
    #rehat-loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: #FAF7F2; font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    }
    #rehat-loading .brand {
      color: #0F0907; font-size: 22px; font-weight: 700; letter-spacing: 2px;
    }
    #rehat-loading .sub { color: #B47832; font-size: 13px; letter-spacing: 1px; }
    #rehat-loading .ring {
      width: 34px; height: 34px; border: 3px solid #E9E3D5;
      border-top-color: #B47832; border-radius: 50%;
      animation: rehat-spin 0.9s linear infinite;
    }
    @keyframes rehat-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="rehat-loading">
    <div class="ring"></div>
    <div class="brand">REHAT</div>
    <div class="sub">COFFEEHOUSE</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
