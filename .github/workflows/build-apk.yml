name: Build APK

# Build APK release. Jalankan manual, atau otomatis saat membuat tag versi
# (mis. `git tag v1.0.1 && git push --tags`).
on:
  workflow_dispatch:
  push:
    tags: ['v*']

env:
  API_BASE_URL: https://rehat-backend-production.up.railway.app/v1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK pelanggan (customer, ramping)
        run: >
          flutter build apk --release
          --flavor customer --split-per-abi
          --dart-define=ADMIN_BUILD=false
          --dart-define=API_BASE_URL=$API_BASE_URL

      - name: Build APK admin/kasir
        run: >
          flutter build apk --release
          --flavor admin --split-per-abi
          --dart-define=ADMIN_BUILD=true
          --dart-define=API_BASE_URL=$API_BASE_URL

      # Catatan: APK ini debug-signed (belum untuk Play Store). Untuk rilis
      # resmi, tambahkan keystore + key.properties lalu build AAB.
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rehat-apk-release
          path: build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error
