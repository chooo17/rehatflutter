name: rehat_app
description: "Rehat Coffeehouse — aplikasi mobile ordering."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Networking
  dio: ^5.7.0

  # Navigation
  go_router: ^14.6.2

  # State management
  flutter_riverpod: ^2.6.1

  # Secure token storage
  flutter_secure_storage: ^9.2.2

  # Images
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2

  # Membuka halaman pembayaran DOKU Checkout
  url_launcher: ^6.3.1

  # Render QRIS dinamis (DOKU Direct API) jadi kode QR
  qr_flutter: ^4.1.0

  # Animations
  flutter_animate: ^4.5.0

  # Formatting (Rupiah currency, dates)
  intl: ^0.20.2

  # Ekspor & bagikan file (mis. CSV tutup kasir) — Android share sheet / unduhan web.
  share_plus: ^10.1.2

  # Push notification (FCM)
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  # Pemantau crash produksi (stack trace otomatis ke Firebase Console).
  firebase_crashlytics: ^4.1.5
  # Analitik funnel (mobile). Aman no-op bila Firebase tak terinisialisasi (web).
  firebase_analytics: ^11.3.3

  # Printer thermal Bluetooth (Android) + ESC/POS. Di-import HANYA pada impl
  # mobile (conditional import) agar build web tidak terpengaruh.
  print_bluetooth_thermal: ^1.1.1
  esc_pos_utils_plus: ^2.0.4
  permission_handler: ^11.3.1
  # Resize logo struk (pure Dart, aman utk web) sebelum dicetak.
  image: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Generator ikon launcher (Android & iOS) dari satu gambar sumber.
  flutter_launcher_icons: ^0.14.1

  # Splash native (tampil instan saat OS memuat app, sebelum Flutter siap).
  flutter_native_splash: ^2.4.3

# Konfigurasi ikon aplikasi.
# Sumber: assets/icon/app_icon.png (1024x1024). Jalankan:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 23
  # Ikon adaptif Android: latar kuning brand + logo sebagai foreground.
  adaptive_icon_background: "#FFC400"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

# Splash native — warna latar disamakan dengan background app (E9E3D5 terang /
# 23201A gelap) agar transisi ke UI Flutter mulus tanpa lompatan warna.
# Regenerasi: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#E9E3D5"
  image: assets/icon/app_icon.png
  color_dark: "#23201A"
  image_dark: assets/icon/app_icon.png
  android_12:
    image: assets/icon/app_icon.png
    color: "#E9E3D5"
    color_dark: "#23201A"
    image_dark: assets/icon/app_icon.png

flutter:
  uses-material-design: true
  assets:
    - assets/qris/
  # Font di-bundle lokal (bukan unduhan runtime) → teks instan & offline.
  # Inter, Cormorant, Archivo = variable font (satu file untuk semua weight).
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: Cormorant
      fonts:
        - asset: assets/fonts/CormorantGaramond.ttf
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo.ttf
    - family: ArchivoBlack
      fonts:
        - asset: assets/fonts/ArchivoBlack.ttf
    - family: Anton
      fonts:
        - asset: assets/fonts/Anton.ttf
